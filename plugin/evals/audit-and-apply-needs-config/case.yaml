schema_version: "1.1"
name: audit-and-apply-needs-config
description: >
  The same audit request as audit-and-apply-waits-for-go-ahead, but the
  Project config's `## Data connectors` is `unset`, so the skill has no known
  way to read the notes database. It stops, says the connectors are missing
  and tells the operator to run /harness:setup-harness, instead of guessing
  that bin/notes-db is the way in. Nothing reaches the CLI.
tags: [audit-and-apply]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
context:
  scaffold_script: fixture-repo.sh
