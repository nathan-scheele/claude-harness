schema_version: "1.1"
name: guided-human-step-hand-over
description: >
  The operator asks to be walked through two steps only they can do before a
  merge: verifying a sending domain in the mail provider's dashboard, and a
  credentialed command sequence that adds a production secret and restarts.
  guided-human-step reads each step's current state through the Project
  config's connector reads, saves a status list under .human-steps/, hands
  over both steps in priority order with a deep link, numbered actions and the
  end state it will check, and delivers the commands as a script file plus a
  one-line invocation. It never runs the script or any write or sign-in
  command itself.
tags: [guided-human-step]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Write, Edit]
context:
  scaffold_script: fixture-repo.sh
