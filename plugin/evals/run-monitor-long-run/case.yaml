schema_version: "1.1"
name: run-monitor-long-run
description: >
  run-monitor watches a CI run that takes several polls to finish (the fake gh
  advances one state per status read). The agent polls from the main session at
  the interval the operator set, posts more than one status update while the run
  is in progress instead of one blocking watch, and before calling it done checks
  the outcome against Project config: the run is green but its deploy job was
  skipped, so nothing shipped.
tags: [run-monitor]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  append_system_prompt: >
    This sandbox has no network and no real GitHub CLI. A stand-in GitHub CLI
    is installed at .fake-gh/bin/gh in the working directory; run it by that
    path wherever you would run `gh`, and tell any subagent you start to do the same.
context:
  scaffold_script: fixture-repo.sh
