schema_version: "1.1"
name: private-api-recon-needs-config
description: >
  The same request as private-api-recon-labels, but the Project config's
  `## Data connectors` is `unset`, so the skill can't tell whether the labels
  app already has a connector (the ladder's first rung). It stops, says the
  connectors are missing and tells the operator to run /harness:setup-harness,
  instead of starting recon: no page opened in the Harness browser, no files
  written.
tags: [private-api-recon]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: >
    Plain `git` may fail in this sandbox: run git as .fake-git/bin/git
    instead. This sandbox has no network: a stand-in curl in .fake-curl/bin
    answers the Labels API, so run curl, and any script that calls curl,
    with that directory first on PATH (`PATH="$PWD/.fake-curl/bin:$PATH"
    <command>`).
context:
  scaffold_script: fixture-repo.sh
