schema_version: "1.1"
name: guided-human-step-needs-config
description: >
  The same hand-over request as guided-human-step-hand-over, but the Project
  config's `## Data connectors` is `unset`, so the skill can't choose a
  read-only check for either vendor system. It stops before writing a status
  list, says the connectors are missing and tells the operator to run
  /harness:setup-harness, instead of guessing a CLI to read. Nothing reaches
  either vendor CLI.
tags: [guided-human-step]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Write, Edit]
  append_system_prompt: >
    Plain `git` may fail in this sandbox: run git as .fake-git/bin/git
    instead, and tell any subagent you start to do the same.
context:
  scaffold_script: fixture-repo.sh
