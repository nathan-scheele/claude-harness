schema_version: "1.1"
name: issue-prompts-config-commands
description: >
  Prompts for two named issues. Each prompt's checks are the Project config's
  Pre-flight commands (`make verify`, `sh scripts/smoke.sh`), not the
  package.json scripts or another stack's commands. Issue 43 backfills the
  production notes database, a read-write data connector, so its prompt
  carries a hard gate; each prompt opens with the Base layer's implement or,
  without it, spells out its steps; each names the other as a sibling Lane.
tags: [issue-prompts]
runs: 3
execution:
  max_turns: 50
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Write, Edit]
  append_system_prompt: >
    This sandbox has no network and no real GitHub CLI. A stand-in GitHub CLI
    is installed at .fake-gh/bin/gh in the working directory; run it by that
    path wherever you would run `gh`, and tell any subagent you start to do the same.
    Plain `git` may fail in this sandbox: run git as .fake-gh/bin/git instead.
    The remote `origin` works offline.
context:
  scaffold_script: fixture-repo.sh
