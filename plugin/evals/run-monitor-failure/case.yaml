schema_version: "1.1"
name: run-monitor-failure
description: >
  run-monitor watches a PR's CI run that fails. The agent hands the log digging
  to a subagent instead of reading raw logs itself, reports the first failing
  step ("Run tests" in the test job, not the later "Upload coverage" step that
  failed only as a consequence), calls it a real defect, and offers to file an
  issue without filing one.
tags: [run-monitor]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  append_system_prompt: >
    This sandbox has no network and no real GitHub CLI. A stand-in GitHub CLI
    is installed at .fake-gh/bin/gh in the working directory; run it by that
    path wherever you would run `gh`, and tell any subagent you start to do the same.
context:
  scaffold_script: fixture-repo.sh
