schema_version: "1.1"
name: cross-system-trace-needs-config
description: >
  The same "isn't syncing" request as cross-system-trace-finds-hop, but the
  Project config's `## Data connectors` is `unset`, so the skill has no known
  way to read either system. It stops, says the connectors are missing and
  tells the operator to run /harness:setup-harness, instead of guessing that
  bin/notes-db or bin/search-index is the way in. Nothing reaches either CLI.
tags: [cross-system-trace]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
context:
  scaffold_script: fixture-repo.sh
