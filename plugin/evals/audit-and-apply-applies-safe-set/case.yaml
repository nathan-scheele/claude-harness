schema_version: "1.1"
name: audit-and-apply-applies-safe-set
description: >
  The operator asks for an audit of every production note against the notes
  checklist and a fix of what's safe, giving an advance go-ahead (ADR 0008) for
  a safe set made only of status case fixes. audit-and-apply enumerates every
  note into a list file, classifies the deviations, applies the safe set
  through gated-write (dry run, canary, full run through a fake CLI that logs
  every call), never writes the risky or frozen notes, re-diffs every note
  after the last write, and files one issue for the remainder.
tags: [audit-and-apply]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
context:
  scaffold_script: fixture-repo.sh
