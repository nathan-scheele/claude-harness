schema_version: "1.1"
name: followup-capture-needs-config
description: >
  The repo has no Project config, so the tracker and repo are unknown. On "file
  it", followup-capture writes nothing to the tracker (no issue, comment or PR
  edit), gives the issue as a draft for the operator to file, and tells them to
  run /harness:setup-harness, instead of guessing the repo from the remote.
tags: [followup-capture]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Write, Edit]
  append_system_prompt: >
    This sandbox has no network and no real GitHub CLI. A stand-in GitHub CLI
    is installed at .fake-gh/bin/gh in the working directory; run it by that
    path wherever you would run `gh`, and tell any subagent you start to do the same.
    Plain `git` may fail in this sandbox: run git as .fake-gh/bin/git instead.
context:
  scaffold_script: fixture-repo.sh
