schema_version: "1.1"
name: setup-rerun-updates
description: >
  Re-running setup-harness over an existing Project config updates that file in
  place: the renamed CI job is picked up, every section still appears once, the
  operator's existing values and notes survive, and no second config file appears.
tags: [setup]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture-repo.sh
