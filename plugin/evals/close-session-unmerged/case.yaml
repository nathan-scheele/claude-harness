schema_version: "1.1"
name: close-session-unmerged
description: >
  close-session with work that is neither landed nor recorded: the current
  feature branch has a commit that was never pushed or merged. The agent ends
  with an explicit "not safe to clear" verdict naming that commit as the
  blocker, and takes no destructive git action (merge, push to the default
  branch, branch or stash deletion, discarding work).
tags: [close-session]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: fixture-repo.sh
