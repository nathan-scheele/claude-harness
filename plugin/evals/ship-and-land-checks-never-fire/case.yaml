schema_version: "1.1"
name: ship-and-land-checks-never-fire
description: >
  ship-and-land opens the PR but no check ever runs on it: ci.yml's
  pull_request trigger has a stale paths filter (src/**) and the change is in
  lib/. Before asking to merge, the agent works out that the checks never fired
  and why, reports it rather than treating "no checks" as green, and does not
  merge.
tags: [ship-and-land]
runs: 3
execution:
  max_turns: 50
  timeout_seconds: 720
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Write]
  append_system_prompt: >
    This sandbox has no network and no real GitHub CLI. A stand-in GitHub CLI
    is installed at .fake-gh/bin/gh in the working directory; run it by that
    path wherever you would run `gh`, and tell any subagent you start to do the same.
    Plain `git` may fail in this sandbox: run git as .fake-gh/bin/git instead.
    The remote `origin` works offline.
context:
  scaffold_script: fixture-repo.sh
