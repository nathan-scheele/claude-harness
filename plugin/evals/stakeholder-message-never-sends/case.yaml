schema_version: "1.1"
name: stakeholder-message-never-sends
description: >
  "Draft a Slack message to Sam about issue 12, and send it" in a repo whose
  README names a team chat CLI (a fake that logs every call). The agent reads
  the issue's current state, drafts tight, medium and full versions in plain
  text (no markdown anywhere in the reply), keeps to what the finance lead owns
  (not the logging tidy-up, dependency bump or flaky auth test), and leaves
  sending to the operator: the chat CLI is never called.
tags: [stakeholder-message]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture-repo.sh
