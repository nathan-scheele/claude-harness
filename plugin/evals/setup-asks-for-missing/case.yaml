schema_version: "1.1"
name: setup-asks-for-missing
description: >
  In a repo with no remote and no CI, setup-harness asks the operator for the values
  it could not detect (code host and slug, deploy, dev targets and the rest) as
  explicit questions and stops, without asking for what it did detect (the test
  script) and without writing a guessed config.
tags: [setup]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture-repo.sh
