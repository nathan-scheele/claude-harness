schema_version: "1.1"
name: setup-detects-from-repo
description: >
  setup-harness detects the code host, repo slug, default branch, CI workflows and
  jobs, and pre-flight commands from the repo, presents them as found instead of
  asking for them, and writes nothing before the operator has answered for the rest.
tags: [setup]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture-repo.sh
